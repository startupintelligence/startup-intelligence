<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign in | Startup Intelligence</title>
  <style>
    :root{color-scheme:dark;--bg:#071426;--panel:#10233b;--text:#eef6ff;--muted:#a8bbd1;--line:#29445f;--accent:#39d5ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#123353,var(--bg) 65%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.panel{width:min(100%,760px);padding:clamp(24px,5vw,48px);border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 24px 80px #0005}h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:28px}.card{display:block;padding:22px;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;background:#0a1a2d;transition:transform .2s,border-color .2s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:2px solid transparent}.card strong{display:block;font-size:1.15rem;margin-bottom:8px}.card span{color:var(--muted)}.note{font-size:.9rem;margin-top:24px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="panel"><p>STARTUP INTELLIGENCE</p><h1>Welcome back.</h1><p>Choose the account area you need.</p><div class="cards"><a class="card" href="customer/"><strong>Customer account</strong><span>Sign in or create a customer account.</span></a><a class="card" href="office/"><strong>Office access</strong><span>For staff members who have already been approved.</span></a></div><p class="note">Office access is approval-only. Creating a customer account does not grant administrative permissions.</p></main></body>
</html>
